name: CI

on:
  push:
    branches: [master]
    # Release process (M9): pushing a version tag runs the identical gates,
    # then attaches both packaging artifacts (ADR 0005) to a GitHub release
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # contents: write is required by `gh release create`; everything else stays read-only
  contents: write

jobs:
  build-and-test:
    # net10.0-windows + WinForms host: Windows runner is mandatory
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fail fast before building anything from a mislabeled tag
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version.Trim()
          if ('${{ github.ref_name }}' -ne "v$version") {
            Write-Error "Tag ${{ github.ref_name }} does not match project version $version (Directory.Build.props)"
            exit 1
          }

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up .NET (pinned via global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Backend build (TreatWarningsAsErrors)
        run: dotnet build --configuration Release

      - name: Verify generated TypeScript bridge contracts
        run: dotnet run --project tools/Wec.ContractGenerator --configuration Release --no-build -- --check

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      # Emits into src/Wec.Host/wwwroot so the host publish carries the UI
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Backend tests
        run: dotnet test --configuration Release --no-build

      # Packaging (ADR 0005): self-contained win-x64 so target machines need no
      # .NET runtime. Compiles for the RID, so --no-build does not apply here.
      # Only when every gate above passed, and only for master pushes and version tags.
      - name: Publish host (self-contained win-x64)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: dotnet publish src/Wec.Host --configuration Release --runtime win-x64 --self-contained true --output publish

      # Startup smoke test on the published exe: catches the wiring-crash class
      # (EF model mismatch, DI ctor problems) that unit tests cannot see.
      # The runner image ships Edge, so the WebView2 Evergreen runtime exists.
      - name: Smoke-test published host
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          $process = Start-Process publish\Wec.Host.exe -PassThru
          Start-Sleep -Seconds 20
          $exitedEarly = $process.HasExited
          if (-not $exitedEarly) { Stop-Process -Id $process.Id -Force }
          $logDirectory = "$env:LOCALAPPDATA\Wec\logs"
          $log = Get-ChildItem $logDirectory -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 1
          $initialized = $log -and (Select-String -Path $log.FullName -Pattern 'WebView2 initialized' -Quiet)
          if ($exitedEarly -or -not $initialized) {
            Write-Host "exited early: $exitedEarly, WebView2 initialized: $initialized"
            if ($log) { Get-Content $log.FullName -Tail 50 }
            exit 1
          }

      - name: Create portable ZIP
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        id: package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version.Trim()
          $zipName = "wec-$version-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $zipName
          "zip-name=$zipName" >> $env:GITHUB_OUTPUT

      # Inno Setup 6 is preinstalled on the windows-latest runner image
      - name: Build per-user installer
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version.Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\wec-installer.iss /DAppVersion=$version /Odist /Q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ZIP artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: wec-win-x64-${{ github.sha }}
          path: ${{ steps.package.outputs.zip-name }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: wec-setup-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          gh release create '${{ github.ref_name }}' '${{ steps.package.outputs.zip-name }}' $setup --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
