name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # net9.0-windows + WinForms host: Windows runner is mandatory
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up .NET (pinned via global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      # Emits into src/Wec.Host/wwwroot so the host publish carries the UI
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Backend build (TreatWarningsAsErrors)
        run: dotnet build --configuration Release

      - name: Backend tests
        run: dotnet test --configuration Release --no-build

      # Packaging (ADR 0005): self-contained win-x64 so target machines need no
      # .NET runtime. Compiles for the RID, so --no-build does not apply here.
      # Only when every gate above passed, and only for pushes to master.
      - name: Publish host (self-contained win-x64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet publish src/Wec.Host --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Create portable ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version.Trim()
          $zipName = "wec-$version-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $zipName
          "zip-name=$zipName" >> $env:GITHUB_OUTPUT

      # Inno Setup 6 is preinstalled on the windows-latest runner image
      - name: Build per-user installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version.Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\wec-installer.iss /DAppVersion=$version /Odist /Q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ZIP artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: wec-win-x64-${{ github.sha }}
          path: ${{ steps.package.outputs.zip-name }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: wec-setup-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
